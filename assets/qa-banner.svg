<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="0.52" stop-color="#101B33"/>
      <stop offset="1" stop-color="#17102D"/>
    </linearGradient>
    <linearGradient id="accent" x1="170" y1="80" x2="1010" y2="245" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#A5B4FC" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#background)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <circle cx="1090" cy="35" r="205" fill="#7C3AED" fill-opacity="0.10"/>
  <circle cx="80" cy="300" r="180" fill="#00D4FF" fill-opacity="0.08"/>

  <g opacity="0.75">
    <path d="M100 68H270" stroke="#00D4FF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="84" cy="68" r="5" fill="#00D4FF"/>
    <path d="M930 252H1100" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="1116" cy="252" r="5" fill="#8B5CF6"/>
  </g>

  <g transform="translate(1030 78)" opacity="0.9">
    <path d="M0 0L26 15V45L0 60L-26 45V15L0 0Z" stroke="url(#accent)" stroke-width="3"/>
    <path d="M-11 30L-3 38L14 20" stroke="#00D4FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="600" y="104" fill="#A5B4FC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="5" text-anchor="middle">HELLO, QUALITY WORLD</text>
  <text x="600" y="170" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="middle">Matheus Pereira Salvador</text>
  <rect x="354" y="190" width="492" height="3" rx="1.5" fill="url(#accent)" filter="url(#glow)"/>
  <text x="600" y="235" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="middle">QA Analyst  •  Test Automation  •  Quality Engineering</text>
  <text x="600" y="274" fill="#64748B" font-family="Consolas, monospace" font-size="15" text-anchor="middle">expect(software).toBeReliable()</text>

  <rect x="1" y="1" width="1198" height="318" rx="21" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="2"/>
</svg>
